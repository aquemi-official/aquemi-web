name: Design system check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rules (tokens, components, renderer classes)
        run: python tools/design_system.py check
      - name: Studio rules and a dry-run release of the live site
        run: python studio/studio.py check
      - name: Generated files are current
        run: |
          python tools/design_system.py build
          if ! git diff --exit-code -- design-system/tokens.css design-system/components.json design-system/components/bundle.css assets/aquemi-site.js content/pages.json studio/web/studio.js studio-data/; then
            echo "::error::A generated file is out of date. Run: python tools/design_system.py build, then commit."
            exit 1
          fi
