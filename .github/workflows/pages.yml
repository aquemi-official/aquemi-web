name: Publish site

# One GitHub Pages site carries all three branches:
#   main     -> https://aquemi-official.github.io/aquemi-web/          (production)
#   staging  -> https://aquemi-official.github.io/aquemi-web/staging/  (review before release)
#   dev      -> https://aquemi-official.github.io/aquemi-web/dev/      (day-to-day work)
# A push to any of them rebuilds the whole site from the latest commit of each branch.
# The studio (studio/manifest.json, "release") decides what each copy is: the tooled draft (site, studio bar and
# tool pages) or the live site (python tools/studio.py release: only the website). /live/ always shows main released,
# so the live site can be reviewed before production switches; once it does, the tooled main moves to /studio/.
# The tooled staging and dev copies leave out versions/ and design-system/inspiration/ to stay inside the Pages size
# limit; page history and the image gallery work on the production (or /studio/) copy only. See studio/README.md.

on:
  push:
    branches: [main, staging, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src-main
      - uses: actions/checkout@v4
        with:
          ref: staging
          path: src-staging
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: src-dev
      # The assembler comes from the commit that triggered this run, so the newest studio tooling assembles every copy
      - uses: actions/checkout@v4
        with:
          path: self
          sparse-checkout: |
            tools
            studio
      - name: Assemble production, staging, dev and the live preview
        run: |
          python3 self/tools/studio.py assemble _site --main src-main --staging src-staging --dev src-dev
          du -sh _site _site/live
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
